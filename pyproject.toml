[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsentry"
version = "0.1.0.dev1"
description = "Intent-aware runtime security gateway for controlled LLM agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "lark>=1.2,<2", "httpx>=0.27,<1", "PyYAML>=6,<7",
  "mcp>=1.20,<2", "cryptography>=43", "jsonschema>=4.23,<5", "referencing>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8"]
models = ["transformers>=4.45,<5", "torch>=2.6", "sentencepiece>=0.2"]

[project.scripts]
agentsentry = "agentsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["case(id): engineering test design ID", "linux: requires Linux isolation", "model: requires optional local model weights"]

[tool.coverage.run]
source = ["agentsentry"]
branch = true


[tool.setuptools.package-data]
"agentsentry.api" = ["static/index.html", "static/assets/*"]
